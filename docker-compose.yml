services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: salsmart
      POSTGRES_PASSWORD: salsmart
      POSTGRES_DB: salsmart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salsmart"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DEBUG=false
      - DATABASE_URL=postgresql+psycopg://salsmart:salsmart@db:5432/salsmart
      # Required for the backend (32+ random chars, in .env or exported). The app refuses to start
      # without it (backend/app/core/config.py). Not required for `docker compose up -d db`, which tests use.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure:3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
