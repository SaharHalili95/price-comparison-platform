version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DEBUG=false
      - USE_REAL_SCRAPERS=false
      # Required: app now refuses to start outside DEBUG with a placeholder
      # or short secret (see backend/app/core/config.py). Set this in a
      # .env file next to this compose file, or export it before running
      # `docker compose up` - ${JWT_SECRET_KEY:?...} fails the command
      # up front instead of crash-looping the container.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY (32+ random chars) before running docker compose up}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
