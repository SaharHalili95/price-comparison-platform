apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: { app: rabbitmq }
  ports: [{ name: amqp, port: 5672 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1-alpine
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: salsmart }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: salsmart-secrets, key: rabbitmq-password } }
          ports: [{ containerPort: 5672 }]
          readinessProbe:
            exec: { command: [rabbitmq-diagnostics, -q, check_port_connectivity] }
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/rabbitmq }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
